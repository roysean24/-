<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <title>纸间图书馆 · 馆藏检索</title>
  <link rel="stylesheet" href="./library.css">
  <script defer src="./library.js"></script>
</head>
<body>
<header><div class="wrap bar">
  <a class="brand" href="./"><i class="mark" aria-hidden="true"></i>纸间图书馆</a>
  <nav aria-label="图书馆导航"><a href="./admin.html">管理书目</a><a class="primary" href="https://github.com/roysean24/-/upload/main/books" target="_blank" rel="noopener">↑ 上传 PDF</a></nav>
</div></header>
<main class="wrap">
  <section class="hero" aria-labelledby="hero-title">
    <div><h1 id="hero-title">馆藏检索<span>。</span></h1>
      <p>按书名或作者查找馆藏，翻阅阅读笔记，打开已收录的 PDF。</p>
      <label class="search"><i aria-hidden="true"></i><input id="query" type="search" aria-label="搜索书名、作者或笔记" placeholder="搜索书名、作者或笔记" autocomplete="off"></label>
    </div>
    <aside id="excerpt" hidden><small>馆藏书摘</small><blockquote id="excerpt-text"></blockquote><button id="excerpt-source" type="button"></button></aside>
  </section>
  <section aria-labelledby="collection">
    <div class="heading"><div><h2 id="collection">全部馆藏</h2><span id="count" aria-live="polite"></span></div>
      <div class="controls"><label><input type="checkbox" id="pdf-only"> 仅看 PDF</label><select id="sort" aria-label="书目排序"><option value="default">馆藏顺序</option><option value="title">按书名</option><option value="date">按阅读日期</option><option value="rating">按推荐评分</option></select><button id="view" aria-pressed="false">列表视图</button></div>
    </div>
    <div id="categories" aria-label="按分类筛选"></div>
    <p id="status" role="status">正在加载馆藏…</p>
    <div id="books" class="shelves"></div>
    <div id="empty" hidden><h3>没有找到匹配的书籍</h3><p>可以换一个关键词，或查看全部馆藏。</p><button id="reset" class="primary">清除筛选</button></div>
  </section>
</main>
<footer class="wrap"><span>纸间图书馆</span><a href="#hero-title">返回顶部 ↑</a></footer>
<dialog id="details" aria-labelledby="detail-title">
  <div class="dialog-inner"><button class="close" id="close" type="button" aria-label="关闭详情">×</button>
    <small id="detail-cat"></small><h2 id="detail-title"></h2><p id="detail-by"></p>
    <div id="files"></div><section id="quote-section"><h3>书摘</h3><blockquote id="quote"></blockquote></section>
    <section id="note-section"><h3>阅读笔记</h3><p id="note"></p></section>
  </div>
</dialog>
</body></html>
